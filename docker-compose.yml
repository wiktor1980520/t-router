services:
  trouter-backend:
    build: .
    container_name: trouter-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PAYMENT_CHANNEL=${PAYMENT_CHANNEL:-bestpay}
      - BESTPAY_API_URL=${BESTPAY_API_URL:-}
      - BESTPAY_MERCHANT_ID=${BESTPAY_MERCHANT_ID:-}
      - BESTPAY_APP_ID=${BESTPAY_APP_ID:-}
      - BESTPAY_KEY=${BESTPAY_KEY:-}
      - SMS_PROVIDER=${SMS_PROVIDER:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_TEMPLATE_ID=${SMS_TEMPLATE_ID:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - PORT=8080
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-60s}
    volumes:
      - ./data:/app/data # For SQLite database or logs if needed
