version: '3.8'

services:
  trouter-backend:
    build: .
    container_name: trouter-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SMS_PROVIDER=${SMS_PROVIDER}
      - SMS_API_KEY=${SMS_API_KEY}
      - SMS_TEMPLATE_ID=${SMS_TEMPLATE_ID}
      - PORT=8080
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-60s}
    volumes:
      - ./data:/app/data # For SQLite database or logs if needed
    # networks:
    #   - 1panel-network

